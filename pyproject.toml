[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "29th-Day", email = "43274844+29th-Day@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=4",
    "lightning>=2.6",
    "torchmetrics>=1.9",
]

[project.scripts]
# project = "project:main"

[dependency-groups]
dev = [
    "ai-edge-model-explorer>=0.1.33",
    "basedpyright>=1.40",
    "ruff>=0.16",
]
rocm = ["torch>=2.14", "triton-rocm"]
cuda = ["torch>=2.14"]
cpu = ["torch>=2.14"]
build = [
    "pooch>=1.8",
    "tensorflow-cpu>=2.20",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# AMD (ROCm) by default; swap with `--no-group rocm --group cuda` (or `cpu`).
default-groups = ["dev", "rocm"]
environments = ["sys_platform == 'linux'"]
conflicts = [[{ group = "rocm" }, { group = "cuda" }, { group = "cpu" }]]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm", group = "rocm" },
    { index = "pytorch-cu130", group = "cuda" },
    { index = "pytorch-cpu", group = "cpu" },
]
triton-rocm = [{ index = "pytorch-rocm", group = "rocm" }]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "Q"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "recommended"
include = ["src", "scripts/explore_model.py", "scripts/build_dataset.py"]
# nn.Module.__call__ and parts of torch/Lightning are typed as Any or left untyped.
reportAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
# In-place torch APIs (nn.init.*_, backward, optimizer.step) return values nobody uses.
reportUnusedCallResult = false
