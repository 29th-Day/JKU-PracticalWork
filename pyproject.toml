[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "29th-Day", email = "43274844+29th-Day@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
# project = "project:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
rocm = ["torch>=2.14", "pytorch-triton-rocm"]
cuda = ["torch>=2.14"]

[tool.uv]
conflicts = [[{ extra = "rocm" }, { extra = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm", extra = "rocm" },
    { index = "pytorch-cu126", extra = "cuda" },
]
pytorch-triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]
